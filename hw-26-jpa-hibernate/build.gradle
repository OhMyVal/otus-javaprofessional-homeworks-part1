plugins {
    id 'java'
}

group = 'ru.otus.ohmyval.java.prof'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation('org.hibernate:hibernate-core:5.4.26.Final')
    implementation('org.hibernate:hibernate-validator:7.0.0.CR1')
    runtimeOnly('org.postgresql:postgresql:42.7.3')
    implementation('javax.el:javax.el-api:2.2.4')
    implementation('org.glassfish.web:javax.el:2.2.4')
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}